name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # Windows only: the app is a Windows program.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The app embeds the built page, so the page is built first. Rust is preinstalled on the runner.
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
  launcher-matches-source:
    # The plugin ships a pre-built launcher (dist/office.mjs). This job rebuilds it and fails if the committed
    # file differs. The exe next to it is NOT checked this way: a Rust build is not byte-for-byte repeatable.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/build-plugin.mjs --no-app
      - run: git diff --exit-code -- plugin/onecarat-agent-office/dist/office.mjs
